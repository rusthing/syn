[package]
name = "syn-api"
description = "syn 的配置契约：五段同步规则（匹配 / 映射 / 动作 / 判定 / 校验）、实体、DTO 与 VO"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { workspace = true }
thiserror = { workspace = true }
strum = { workspace = true, features = ["derive"] }
utoipa = { workspace = true }
derive_setters = { workspace = true }
typed-builder = { workspace = true }
wheel-rs = { workspace = true }
robotech = { workspace = true, features = ["macros", "openapi"] }

# 服务端才需要的：实体映射、DTO↔实体转换、入参校验
sea-orm = { workspace = true, optional = true }
o2o = { workspace = true, optional = true }
validator = { workspace = true, features = ["derive"] }

[features]
# `server` 打开 mo 与 dto 的实体转换；只读 `spec` 的工具不带这个特性
server = [
    "sea-orm",
    "o2o",
    "robotech/macros",
    "robotech/orm",
    "robotech/db",
]
