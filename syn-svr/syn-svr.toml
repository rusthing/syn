# syn-svr 配置文件（本地开发）
#
# 由 build.rs 拷到 target/<profile>/，`profile` 决定再叠一层 `syn-svr-{profile}.toml`。
# 生产以配置中心 KV `syn-svr.toml` 为准（那里只放 `[db]` 连接串），本文件是本地开发的形态。
#
# 原则：**这里只写业务策略与本地便利**。端口、雪花 node、目标地址、取数计划
# 都不该出现 —— 分别由框架、注册中心、jobx 负责，写进来就会挡住换环境。
profile = "dev"

[db]
url = "postgresql://syn:syn@localhost:5432/syn"

# 本地固定端口：syn-web 的 vite 代理写死 9007。
# 生产不配：端口由框架随机分配，真实端口登记在注册中心。
[web]
port = 9007

# [id-worker] 不配：node 由框架按实例自动分配并把结果记进注册中心的 `id-node`。
# 只有「自动分配失败回退 0」时才需要显式指定。

# 同步执行器自身配置（对应 AppConfig::syn）
[syn]
# 取数超时：拉一页数据的最长等待
# pull-timeout = "30s"
# 启动是否预加载任务快照
# load-on-start = true

# 取数心跳：**默认就注册**（name/executor-code/interval/保留时长都有默认值），
# 不需要写这段。本地没有 jobx 时会自动跳过并 warn 一条。
# 想显式关掉：
# [syn.pull-job]
# enabled = false

# jobx 客户端。注册取数计划要用；`svc-name` 必须是**注册中心里的服务名原样**，
# 框架不会再拼 profile 前缀（拼错的表现是「发现 0 个实例」，注册分组直接失败）。
# [api.jobx]
# type = "MicroSvc"
# svc-name = "jobx-svr"
# timeout = "3s"

# jobx 执行器从 Redis Stream 收任务。没配时跳过取数心跳注册，sink 推送不受影响。
# [redis]
# url = "redis://:xxxxxxxx@localhost:6379"

# 任务快照的刷新信号走 NATS。没配时多副本「改了任务只有写的那台生效」。
# [nats]
# servers = ["nats://localhost:4222"]

# DB 直写下场：`target.kind = db` 的 `target.datasource` 就是这里的键。
#
# 一个下游一个账号（权限最小）。不要共用高权账号：syn 的配置本身能被改，
# 共用账号等于「改一条任务配置就能写任何库任何表」。
#
# [syn.datasources.dtw]
# url = "postgresql://syn_dtw:xxxxxxxx@10.0.0.12:5432/dtw"
# max-connections = 4

# 配置中心。本地用容器名（/etc/hosts 或 Docker DNS 能解析）。
#
# 两段都要：`config` 拉 `[db]` 与公共配置，`registry` 把自己登记进去 ——
# HTTP 投递靠它按服务名找下游（`target.service`），网关也靠它做 `/syn-svr/*` 的
# 服务发现；不登记的话调用方发现 0 个实例。
[micro-svc.consul]
base-url = "http://consul:8500"

[micro-svc.consul.config]
# 空数组 = 不拉公共配置。common-configs 里的每个 key 都必须真实存在：
# get_configs() 只要有一个拉不到就整体返回 Err，连应用配置一起失效。
common-configs = []

[micro-svc.consul.registry]
