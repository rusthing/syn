# 第一副本配置 —— 与 `syn-svr-b.toml` 完全对称，只差端口与 node。
#
# 为什么不用默认的 `syn-svr.toml`：那份带 `[micro-svc.consul]`，会读 KV
# `dev/syn-svr.toml`，而那里配了 `[syn.pull-job]`（间隔 5s）。jobx 每 5 秒打一次
# 心跳，会在并发测试的窗口里把新行拉走，让「两副本抢同一批」变成「一先一后」，
# 竞态测不出来。这里两个副本都不碰配置中心、都不注册计划，只验游标 CAS 本身。
#
# 用法：`NO_PROXY=127.0.0.1,localhost ./target/debug/syn-svr -c tests/env/syn-svr-a.toml`

profile = "dev"

[db]
url = "postgresql://syn:syn@pgsql:5432/syn"

[web]
port = 9007

[id-worker]
# node-bits=6，取值 0..=63；两副本必须不同，否则雪花 ID 撞主键
node = 3

[syn]
reload-duration = "5s"
self-schedule = false
pull-timeout = "10s"

[syn.targets]
dtw-rs-svr = "http://127.0.0.1:19099"
local-mock = "http://127.0.0.1:19099"

[syn.datasources.adm]
url = "postgresql://postgres:postgres@pgsql:5432/admrs"
max-connections = 4

[syn.datasources.dtw]
url = "postgresql://postgres:postgres@pgsql:5432/dtwrs_ui"
max-connections = 4
