# syn-svr 测试环境配置 —— consul KV `dev/syn-svr.toml`
#
# 写入：curl -X PUT --data-binary @tests/env/consul-dev.toml \
#         http://127.0.0.1:8500/v1/kv/dev/syn-svr.toml
#
# 键的来由：bootstrap! 的 profile = "dev" → group = dev；默认 svc_name 取配置文件
# 文件名 syn-svr；文件格式 toml → data_id = syn-svr.toml。
# 框架按 `ConfigKey::to_string()` 拼成 `dev/syn-svr.toml`。
#
# 这里只放「本机测试环境必须覆盖的东西」：库连接串、jobx 的直连地址、外部源/目标库。
# 端口、雪花 node、快照刷新、下游地址一律不写 —— 端口在仓库自带的
# `syn-svr/syn-svr.toml` 里（vite 代理写死 9007），其余由框架负责。
#
# 这里的 [db] 用 syn 账号（syn 库 owner，迁移建表需要的就是它）；
# [syn.datasources.*] 是**外部源/目标库**，测试环境复用 postgres 账号。
# 生产必须改成每个下游一个最小权限账号，别照抄这一段。

[db]
url = "postgresql://syn:syn@pgsql:5432/syn"

[syn]
# 本机调试时改完任务想立刻看到结果，拉一页也别等太久
pull-timeout = "10s"

# 取数心跳不用配：默认就有（name=「syn 取数心跳」、executor-code=syn.pull、
# interval=5s、group=syn、保留 1h），启动即注册。踩坑见 syn-开发规范 §5.1。

# jobx 客户端。**本机用 Simple 直连**：这套开发环境的 consul 里，每个 rs 服务都挂了一个
# `service:alias-*` 检查且状态是 critical，而框架的服务发现带 `?passing=true`，
# 于是 `MicroSvc` 永远是「发现 0 个实例」—— 不是 jobx 没起，是它在这套 consul 里
# 按 passing 过滤后不可见。生产环境 alias 正常时应改回：
#   [api.jobx] type = "MicroSvc"  svc-name = "jobx-svr"
[api.jobx]
type = "Simple"
base-url = "http://127.0.0.1:9001"
timeout = "3s"

# jobx 执行器从 Redis Stream 收任务，与 jobx-svr 同一个实例
[redis]
url = "redis://:xxxxxxxx@redis:6379"

# 配置中心 + 注册中心。**registry 段必须存在**：它同时启用「向 consul 注册自己」和
# 「发现别人」，而 HTTP 投递的 `target.service` 解析、jobx 客户端都走后者。
# 只配 config 段时发现永远返回 0 个实例，报错是 `NoAvailableInstance`，
# 看起来像下游没起，其实是本地没初始化 registry 后端。
[micro-svc.consul]
base-url = "http://consul:8500"
config.file-format = "toml"

[micro-svc.consul.registry]

# 源库：admrs（人员主数据）。联调只新建 syn_it_* 隔离表，不碰任何业务表。
[syn.datasources.adm]
url = "postgresql://postgres:postgres@pgsql:5432/admrs"
max-connections = 4

# 下游库：dtwrs_ui。DB sink 把 upsert 写进 public.syn_it_person。
[syn.datasources.dtw]
url = "postgresql://postgres:postgres@pgsql:5432/dtwrs_ui"
max-connections = 4
